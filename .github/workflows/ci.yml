name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
        # Note: the test suite does not launch a real browser, so we skip the
        # ~180 MB Chromium download here to keep CI fast.

      - name: Lint (real errors only — syntax / undefined names)
        run: ruff check --select E9,F63,F7,F82 .

      - name: Run tests
        run: pytest -ra

      - name: Verify Alembic migrations apply cleanly (fresh SQLite)
        env:
          BT_MONITOR_DB_URL: sqlite:///migration_check.db
        run: |
          alembic upgrade head
          # Schema must be current: autogenerate should detect no changes.
          alembic check
